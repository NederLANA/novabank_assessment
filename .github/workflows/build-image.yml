# Builds the API container image and pushes it to GitHub Container Registry (free).
# After the first run: GitHub -> your profile -> Packages -> novabank-api -> Package settings -> Change visibility -> Public
# (Public lets Azure pull the image without credentials. It contains code only, no secrets or data.)
name: build-image
on:
  push:
    branches: [main]
    paths: ["app/**"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/novabank-api" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
