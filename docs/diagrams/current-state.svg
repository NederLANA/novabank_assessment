<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Arial, Helvetica, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1000" height="560" fill="#ffffff"/>
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#1f2937">NovaBank - CURRENT STATE (assumed) - Netherlands, on-premises, ONE environment</text>
  <text x="20" y="50" fill="#6b7280">Project: novabank | Region: NL data centre | Env: dev = test = prod (no separation)</text>

  <!-- customers -->
  <rect x="20" y="170" width="150" height="70" rx="8" fill="#e0f2fe" stroke="#0369a1"/>
  <text x="95" y="200" text-anchor="middle" font-weight="bold">Customers (NL)</text>
  <text x="95" y="220" text-anchor="middle" fill="#374151">web / mobile</text>

  <!-- datacentre -->
  <rect x="230" y="80" width="430" height="330" rx="10" fill="#f9fafb" stroke="#374151" stroke-dasharray="6 4"/>
  <text x="245" y="102" font-weight="bold" fill="#374151">NovaBank data centre (NL, on-premises)</text>

  <rect x="260" y="130" width="370" height="60" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="445" y="157" text-anchor="middle" font-weight="bold">Single VM: customer web API</text>
  <text x="445" y="176" text-anchor="middle" fill="#374151">no autoscaling | single point of failure</text>

  <rect x="260" y="240" width="170" height="70" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="345" y="268" text-anchor="middle" font-weight="bold">PostgreSQL</text>
  <text x="345" y="288" text-anchor="middle" fill="#374151">on-prem, one copy</text>

  <rect x="460" y="240" width="170" height="70" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="545" y="268" text-anchor="middle" font-weight="bold">Local log files</text>
  <text x="545" y="288" text-anchor="middle" fill="#374151">no central logging</text>

  <!-- arrows -->
  <line x1="170" y1="205" x2="260" y2="165" stroke="#111827" stroke-width="2"/>
  <text x="185" y="172" fill="#111827">HTTPS</text>
  <line x1="345" y1="190" x2="345" y2="240" stroke="#111827" stroke-width="2"/>
  <line x1="545" y1="190" x2="545" y2="240" stroke="#111827" stroke-width="2"/>

  <!-- assumed dependencies -->
  <rect x="720" y="80" width="260" height="330" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-dasharray="4 4"/>
  <text x="735" y="102" font-weight="bold" fill="#374151">ASSUMED - not confirmed (Discover)</text>
  <rect x="740" y="120" width="220" height="50" rx="6" fill="#ede9fe" stroke="#6d28d9"/>
  <text x="850" y="150" text-anchor="middle">Ledger / payment connectors</text>
  <rect x="740" y="185" width="220" height="50" rx="6" fill="#ede9fe" stroke="#6d28d9"/>
  <text x="850" y="215" text-anchor="middle">Identity / login</text>
  <rect x="740" y="250" width="220" height="50" rx="6" fill="#ede9fe" stroke="#6d28d9"/>
  <text x="850" y="280" text-anchor="middle">Reporting and batch jobs</text>
  <rect x="740" y="315" width="220" height="50" rx="6" fill="#ede9fe" stroke="#6d28d9"/>
  <text x="850" y="345" text-anchor="middle">KYC / AML screening</text>
  <line x1="630" y1="160" x2="740" y2="145" stroke="#6b7280" stroke-dasharray="5 4"/>
  <line x1="430" y1="275" x2="740" y2="275" stroke="#6b7280" stroke-dasharray="5 4"/>
  <text x="640" y="268" fill="#6b7280">who else reads the DB?</text>

  <!-- pains -->
  <text x="20" y="450" font-weight="bold" fill="#b91c1c">Pains we expect to price (EUR):</text>
  <text x="20" y="475" fill="#374151">1. Celebrity-endorsed limited card drop: sign-up surge overwhelms the single VM.</text>
  <text x="20" y="497" fill="#374151">2. Forgotten applications and databases (possibly replicated across regions): cost and compliance risk.</text>
  <text x="20" y="519" fill="#374151">3. Logs stay local: slow incident investigation and manual audit evidence.</text>
  <text x="20" y="541" fill="#374151">4. One environment: every change is tested in production.</text>
</svg>
