<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" font-family="Arial, Helvetica, sans-serif" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1100" height="720" fill="#ffffff"/>
  <text x="20" y="28" font-size="18" font-weight="bold" fill="#1f2937">NovaBank - TARGET STATE (PoC) - Azure, Sweden Central (EU), dev + prod</text>
  <text x="20" y="48" fill="#6b7280">Project: novabank | Terraform-managed | EU-only by policy | Naming: type-novabank-env-sdc</text>

  <!-- developer flow -->
  <rect x="20" y="70" width="170" height="60" rx="8" fill="#e0f2fe" stroke="#0369a1"/>
  <text x="105" y="95" text-anchor="middle" font-weight="bold">GitHub Codespaces</text>
  <text x="105" y="114" text-anchor="middle" fill="#374151">Terraform + az CLI</text>
  <rect x="20" y="160" width="170" height="60" rx="8" fill="#e0f2fe" stroke="#0369a1"/>
  <text x="105" y="185" text-anchor="middle" font-weight="bold">GitHub Actions</text>
  <text x="105" y="204" text-anchor="middle" fill="#374151">builds container image</text>
  <rect x="20" y="250" width="170" height="60" rx="8" fill="#e0f2fe" stroke="#0369a1"/>
  <text x="105" y="275" text-anchor="middle" font-weight="bold">ghcr.io image</text>
  <text x="105" y="294" text-anchor="middle" fill="#374151">novabank-api (code only)</text>
  <line x1="105" y1="220" x2="105" y2="250" stroke="#111827" stroke-width="2"/>
  <text x="115" y="240" fill="#111827">push</text>

  <!-- customers -->
  <rect x="20" y="560" width="170" height="60" rx="8" fill="#e0f2fe" stroke="#0369a1"/>
  <text x="105" y="588" text-anchor="middle" font-weight="bold">Customers / testers</text>
  <text x="105" y="606" text-anchor="middle" fill="#374151">HTTPS only</text>

  <!-- subscription -->
  <rect x="230" y="70" width="600" height="620" rx="10" fill="#f9fafb" stroke="#0369a1" stroke-width="2"/>
  <text x="245" y="92" font-weight="bold" fill="#0369a1">Azure subscription (sandbox) - Region: Sweden Central (EU)</text>
  <rect x="245" y="102" width="570" height="40" rx="6" fill="#fef9c3" stroke="#a16207"/>
  <text x="530" y="120" text-anchor="middle" font-weight="bold">Governance: Azure Policy (allowed EU locations, required tags) + budget alert</text>
  <text x="530" y="136" text-anchor="middle" fill="#374151">applied per resource group</text>

  <!-- DEV -->
  <rect x="245" y="160" width="570" height="245" rx="8" fill="#ecfdf5" stroke="#047857"/>
  <text x="260" y="180" font-weight="bold" fill="#047857">rg-novabank-dev-sdc  (ENV: dev)</text>
  <rect x="265" y="195" width="250" height="80" rx="6" fill="#ffffff" stroke="#047857"/>
  <text x="390" y="218" text-anchor="middle" font-weight="bold">Container App: api</text>
  <text x="390" y="236" text-anchor="middle" fill="#374151">in Container Apps environment</text>
  <text x="390" y="254" text-anchor="middle" fill="#374151">scale 0-3 replicas (HTTP rule)</text>
  <rect x="555" y="195" width="240" height="80" rx="6" fill="#ffffff" stroke="#047857"/>
  <text x="675" y="218" text-anchor="middle" font-weight="bold">PostgreSQL Flexible B1ms</text>
  <text x="675" y="236" text-anchor="middle" fill="#374151">TLS, backups 7 days (PITR)</text>
  <text x="675" y="254" text-anchor="middle" fill="#374151">public catalogue data only</text>
  <rect x="265" y="300" width="530" height="80" rx="6" fill="#ffffff" stroke="#047857"/>
  <text x="530" y="325" text-anchor="middle" font-weight="bold">Log Analytics workspace: log-novabank-dev-sdc</text>
  <text x="530" y="345" text-anchor="middle" fill="#374151">retention 365 days | app + DB logs | restricted access (RBAC)</text>
  <line x1="515" y1="235" x2="555" y2="235" stroke="#111827" stroke-width="2"/>
  <text x="520" y="229" fill="#111827" font-size="10">TLS</text>
  <line x1="390" y1="275" x2="430" y2="300" stroke="#6b7280" stroke-dasharray="4 3"/>
  <line x1="675" y1="275" x2="640" y2="300" stroke="#6b7280" stroke-dasharray="4 3"/>

  <!-- PROD -->
  <rect x="245" y="425" width="570" height="245" rx="8" fill="#fff7ed" stroke="#c2410c"/>
  <text x="260" y="445" font-weight="bold" fill="#c2410c">rg-novabank-prod-sdc  (ENV: prod) - deployed briefly, no customer data</text>
  <rect x="265" y="460" width="250" height="80" rx="6" fill="#ffffff" stroke="#c2410c"/>
  <text x="390" y="483" text-anchor="middle" font-weight="bold">Container App: api</text>
  <text x="390" y="501" text-anchor="middle" fill="#374151">min 1 replica, scale up to 10</text>
  <text x="390" y="519" text-anchor="middle" fill="#374151">absorbs surge (catalogue cache)</text>
  <rect x="555" y="460" width="240" height="80" rx="6" fill="#ffffff" stroke="#c2410c"/>
  <text x="675" y="483" text-anchor="middle" font-weight="bold">PostgreSQL Flexible B1ms</text>
  <text x="675" y="501" text-anchor="middle" fill="#374151">next step: zone-redundant HA</text>
  <text x="675" y="519" text-anchor="middle" fill="#374151">for the 99.9% target</text>
  <rect x="265" y="565" width="530" height="80" rx="6" fill="#ffffff" stroke="#c2410c"/>
  <text x="530" y="590" text-anchor="middle" font-weight="bold">Log Analytics workspace: log-novabank-prod-sdc</text>
  <text x="530" y="610" text-anchor="middle" fill="#374151">retention 365 days | separate from dev | restricted access</text>
  <line x1="515" y1="500" x2="555" y2="500" stroke="#111827" stroke-width="2"/>
  <text x="520" y="494" fill="#111827" font-size="10">TLS</text>
  <line x1="390" y1="540" x2="430" y2="565" stroke="#6b7280" stroke-dasharray="4 3"/>
  <line x1="675" y1="540" x2="640" y2="565" stroke="#6b7280" stroke-dasharray="4 3"/>

  <!-- arrows outside -->
  <line x1="190" y1="280" x2="265" y2="240" stroke="#0369a1" stroke-width="2"/>
  <text x="195" y="262" fill="#0369a1" font-size="10">image pull</text>
  <line x1="190" y1="590" x2="265" y2="505" stroke="#111827" stroke-width="2"/>
  <line x1="190" y1="590" x2="265" y2="245" stroke="#111827" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- on-prem -->
  <rect x="860" y="160" width="220" height="300" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-dasharray="5 4"/>
  <text x="970" y="182" text-anchor="middle" font-weight="bold" fill="#374151">Stays on-premises (Retain)</text>
  <text x="970" y="205" text-anchor="middle" fill="#374151">Ledger / payment connectors</text>
  <text x="970" y="225" text-anchor="middle" fill="#374151">Customer identity (for now)</text>
  <text x="970" y="245" text-anchor="middle" fill="#374151">Reporting and batch jobs</text>
  <text x="970" y="265" text-anchor="middle" fill="#374151">Customer database (prod)</text>
  <text x="970" y="300" text-anchor="middle" fill="#6b7280">Later waves, after gates:</text>
  <text x="970" y="320" text-anchor="middle" fill="#6b7280">private link (VPN/ExpressRoute),</text>
  <text x="970" y="340" text-anchor="middle" fill="#6b7280">one-way DB replication,</text>
  <text x="970" y="360" text-anchor="middle" fill="#6b7280">shadow traffic, canary cutover</text>

  <!-- legend -->
  <rect x="860" y="500" width="220" height="150" rx="8" fill="#ffffff" stroke="#d1d5db"/>
  <text x="872" y="522" font-weight="bold">Tags on every resource</text>
  <text x="872" y="544" fill="#374151">project = novabank</text>
  <text x="872" y="562" fill="#374151">environment = dev | prod</text>
  <text x="872" y="580" fill="#374151">owner = (your name)</text>
  <text x="872" y="606" font-weight="bold">PoC compromises (documented)</text>
  <text x="872" y="624" fill="#374151">public DB endpoint + password,</text>
  <text x="872" y="640" fill="#374151">no private network / WAF yet</text>
</svg>
